<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job-Tracker">
<title>Job-Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<link rel="icon" href="icons/icon-32.png?v=2">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2328;--mute:#68707a;--line:#e1e5ea;--navy:#1f3a5f;--acc:#2563eb;--danger:#b42318;
--s0:#9aa1a9;--s1:#3b82f6;--s2:#d4a017;--s3:#e8792b;--s4:#2e9e5b;--s5:#c2413b;--s6:#5b6470;--rad:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a2029;--ink:#e8ecf1;--mute:#97a0ab;--line:#2a323d;--navy:#9cc0ef;--acc:#7aa7ff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:21px;margin:0;flex:1;color:var(--navy)}
.top small{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.ib{text-decoration:none;color:inherit;border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.ib.pri{color:#0f1318}}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;opacity:.5;white-space:nowrap}
.chip.on{opacity:1;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip b{font-weight:600}
.chip.meta{opacity:1;--c:var(--mute)}
.bar{display:flex;gap:8px;padding-top:8px}
.bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--rad);padding:11px 13px;margin-bottom:9px;cursor:pointer}
.card .r1{display:flex;gap:8px;align-items:baseline}
.card .co{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dt{color:var(--mute);font-size:12px;white-space:nowrap}
.card .ro{margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .r3{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--mute)}
.pill{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
.dots{letter-spacing:1px;color:var(--c2,#d4a017)}
.dots.fit{--c2:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:56px;height:56px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
@media (prefers-color-scheme:dark){.fab{color:#0f1318}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:16px 16px 20px}
.sbody:last-child{padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.sfoot{flex:none;display:flex;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--card)}
.sfoot .ib{flex:1;height:50px;font-size:16px;font-weight:600;border-radius:12px}
.applybtn{display:flex;width:100%;height:48px;margin:6px 0 4px;font-size:16px;font-weight:600;background:var(--s4);border-color:var(--s4);color:#fff;border-radius:12px;text-decoration:none}
.capply{margin-left:auto;border:1px solid var(--s4);color:var(--s4);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:transparent;cursor:pointer}
.miss{color:var(--danger)}
.del{color:var(--danger)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 2px;font-size:19px}
.sheet .sub{color:var(--mute);margin:0 0 12px}
.fl{display:block;margin:10px 0}
.fl>span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.fl input,.fl select,.fl textarea{display:block;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;min-height:42px}
.fl input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;line-height:22px}
.fl input[type=date]::-webkit-date-and-time-value{text-align:left}
.fl select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fl textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
@media (max-width:440px){.row2.stack{grid-template-columns:minmax(0,1fr);gap:0}}
.shead{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.shead .tt{flex:1;min-width:0}
.shead h2{margin:0;font-size:19px}
.shead .sub{margin:2px 0 0;font-size:13.5px}
.shead .ib{height:38px}
.sec{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:16px 0 2px}
.stars{display:flex;gap:6px}
.stars button{flex:1;max-width:64px;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;cursor:pointer;font-size:16px}
.stars button.on{background:var(--c2,#d4a017);border-color:var(--c2,#d4a017);color:#fff}
.stars.fit button.on{--c2:var(--acc)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .ib{height:40px}
.setlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.setb{height:auto!important;min-height:52px;flex-direction:column;align-items:flex-start!important;text-align:left;padding:10px 14px!important;gap:2px!important;width:100%}
.setb b{font-size:16px}
.setb span{font-size:13px;color:var(--mute);font-weight:400}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--bg)}
.box h3{margin:0 0 4px;font-size:14px}
.box p{margin:4px 0;color:var(--mute);font-size:13px}
.ptext{white-space:pre-wrap;font-size:15px;line-height:1.6}
.pnav{display:flex;gap:6px;overflow-x:auto;margin:4px 0 6px;scrollbar-width:none}
.pnav::-webkit-scrollbar{display:none}
.pnav button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.psec{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--pc,var(--mute));border-radius:12px;padding:10px 14px;margin:10px 0}
.psec h3{margin:0 0 6px;font-size:16px;color:var(--pc,var(--ink))}
.psec h4{margin:10px 0 4px;font-size:14.5px}
.psec p{margin:6px 0;font-size:15px;line-height:1.6}
.psec ul{margin:6px 0;padding-left:20px}
.psec li{margin:5px 0;font-size:15px;line-height:1.5}
.sks{display:flex;flex-wrap:wrap;gap:6px}
.sk{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:3px 10px;font-size:13.5px}
.sk.have{border-color:var(--s4);color:var(--ink);background:color-mix(in srgb,var(--s4) 14%,var(--card))}
.psec.skills{--pc:var(--acc)}
.fitline{margin:2px 0 8px}
.cvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.cvrow .ib{flex:1 1 140px}
.cvrow .ib{height:42px;padding:0 16px;font-weight:600}
.cvrow .sub{font-size:12.5px;word-break:break-all}
.cvbox{border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0}
.cvbox p{margin:4px 0}
.fitnote{font-size:13.5px;color:var(--mute);margin:-4px 0 8px}
.toggle{background:none;border:0;color:var(--acc);padding:4px 0;font-size:14px;cursor:pointer}
a{color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.95}
.setup{max-width:520px;margin:30px auto;padding:0 16px}
.setup .box{background:var(--card)}
.mailbar{display:none;margin-top:8px;width:100%;border:1px solid var(--s2);background:color-mix(in srgb,var(--s2) 14%,var(--card));border-radius:10px;padding:8px 11px;text-align:left;cursor:pointer;font-size:14px}
.mailbar.show{display:block}
.sug{border-left:5px solid var(--c);padding-left:12px;margin:10px 0}
.sug .meta{color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.sug blockquote{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13.5px}
.credit{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 0}
.credit a{color:inherit}
.demo{background:#fff7d6;color:#5b4a00;font-size:12.5px;padding:6px 16px;text-align:center}
@media (prefers-color-scheme:dark){.demo{background:#3a3210;color:#f3e3a0}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Demo mit Beispieldaten – Änderungen werden nicht gespeichert.</div>
<header id="hdr" hidden>
  <div class="top">
    <h1>Job-Tracker<small id="cnt"></small></h1>
    <button class="ib" id="bRefresh" title="Aktualisieren" aria-label="Aktualisieren"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    <button class="ib" id="bSettings" title="Einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <button class="mailbar" id="mailbar"></button>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Firma oder Stelle suchen" autocomplete="off">
    <select id="sort" aria-label="Sortierung">
      <option value="date">Neueste zuerst</option>
      <option value="fit">CV passt</option>
      <option value="like">Gefällt mir</option>
      <option value="status">Status</option>
      <option value="company">Firma A–Z</option>
    </select>
  </div>
</header>
<main id="list" hidden></main>
<button class="fab" id="bAdd" hidden aria-label="Neuer Job">+</button>

<div class="setup" id="setup" hidden>
  <h1 style="color:var(--navy)">Job-Tracker</h1>
  <p>Verbinde die App mit deiner Google-Tabelle. Den Einrichtungs-Link bekommst du in der Tabelle über <b>Job-Tracker → App-Link anzeigen</b>.</p>
  <div class="box">
    <label class="fl"><span>Einrichtungs-Link</span><input id="sLink" placeholder="https://…#setup=…" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <p style="margin:6px 0">oder einzeln:</p>
    <label class="fl"><span>App-Link (endet auf /exec)</span><input id="sUrl" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fl"><span>Schlüssel</span><input id="sKey" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <div class="acts"><button class="ib pri" id="sSave">Verbinden</button><button class="ib" id="sDemo">Demo ansehen</button><button class="ib" id="sCancel" hidden>Abbrechen</button></div>
    <p id="sErr" style="color:var(--danger)"></p>
  </div>
  <p class="credit">Created by Matthias Lobinger</p>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '1.6.8', NEED_SCRIPT = '1.6.5'; // siehe CHANGELOG.md
const CREDIT = '<p class="credit">Job-Tracker ' + APP_VERSION + ' · Created by <a href="https://www.linkedin.com/in/matthias-lobinger" target="_blank" rel="noopener">Matthias Lobinger</a></p>';
const STATUS_DEF = ['Noch nicht beworben','Beworben','Zum Gespräch eingeladen','Persönliches Gespräch','Jobangebot','Abgelehnt','Nicht bewerben'];
const SHORT = {'Noch nicht beworben':'Offen','Beworben':'Beworben','Zum Gespräch eingeladen':'Gespräch','Persönliches Gespräch':'Vor Ort','Jobangebot':'Angebot','Abgelehnt':'Abgelehnt','Nicht bewerben':'Nicht bewerben'};
const CK = 'jt-cfg', LK = 'jt-cache', FK = 'jt-filter';
let CFG = null, DEMO = false, jobs = [], statuses = STATUS_DEF.slice(), sheetUrl = '', scriptVersion = '', profile = [];
let filter = { on: STATUS_DEF.slice(), q: '', sort: 'date' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col = (s) => 'var(--s' + Math.max(0, statuses.indexOf(s)) + ')';

/* ---------- Speicher ---------- */
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- API ---------- */
async function api(fn, ...args) {
  if (DEMO) return demoApi(fn, args);
  const HINT = 'Deine Web-App antwortet nicht richtig. Prüfe in Apps Script unter „Bereitstellen → Bereitstellungen verwalten“: Typ Web-App, Ausführen als „Ich“, Zugriff „Jeder“, und dass der App-Link auf /exec endet.';
  let res, raw;
  try {
    res = await fetch(CFG.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, key: CFG.k, args: args }) });
    raw = await res.text();
  } catch (e) { throw new Error('Keine Verbindung (' + e.message + '). ' + HINT); }
  let out;
  try { out = JSON.parse(raw); }
  catch (e) { throw new Error((/accounts\.google|ServiceLogin|signin/i.test(raw) ? 'Google verlangt eine Anmeldung. ' : 'Antwort ist kein JSON (HTTP ' + res.status + '). ') + HINT); }
  if (out.error) {
    if (out.error === 'Kein Zugriff') { showSetup('Der Schlüssel passt nicht (mehr). Bitte deinen aktuellen Einrichtungs-Link öffnen.'); }
    throw new Error(out.error);
  }
  return out.result;
}

function toast(t, ms) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms || 2600);
}

/* ---------- Einrichtung ---------- */
function parseSetup(s) {
  const m = String(s || '').match(/#setup=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
    return valid(o) ? o : null;
  } catch (e) { return null; }
}
function encSetup(o) { return btoa(unescape(encodeURIComponent(JSON.stringify({ u: o.u, k: o.k })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function valid(o) { return o && /^https:\/\/script\.google\.com\/.+\/exec$/.test(o.u || '') && String(o.k || '').length >= 8; }

function showSetup(err) {
  $('setup').hidden = false; $('hdr').hidden = true; $('list').hidden = true; $('bAdd').hidden = true;
  $('sErr').textContent = err || '';
  $('sCancel').hidden = !CFG;
  if (CFG) { $('sUrl').value = CFG.u; $('sKey').value = CFG.k; }
}
function showApp() {
  $('setup').hidden = true; $('hdr').hidden = false; $('list').hidden = false; $('bAdd').hidden = false;
  $('demoBar').hidden = !DEMO;
}
$('sSave').onclick = () => {
  let o = parseSetup($('sLink').value);
  if (!o) o = { u: $('sUrl').value.trim().replace(/\?.*$/, ''), k: $('sKey').value.trim() };
  if (!valid(o)) { $('sErr').textContent = 'Link oder Schlüssel stimmen nicht. Der App-Link beginnt mit https://script.google.com/ und endet auf /exec.'; return; }
  CFG = o; DEMO = false; ls.set(CK, o); ls.del(LK);
  location.replace(location.pathname + '#setup=' + encSetup(o));
  showApp(); load(true);
};
$('sDemo').onclick = () => { DEMO = true; showApp(); load(true); };
$('sCancel').onclick = () => { showApp(); };
$('bSettings').onclick = () => {
  const sv = scriptVersion ? esc(scriptVersion) + (!DEMO && vLess(scriptVersion, NEED_SCRIPT) ? ' – <b style="color:var(--danger)">bitte aktualisieren</b>' : '') : 'wird geprüft …';
  const btn = (id, label, hint) => '<button class="ib setb" id="' + id + '"><b>' + label + '</b>' + (hint ? '<span>' + hint + '</span>' : '') + '</button>';
  openSheet('<h2>Einstellungen</h2><p class="sub">' + (DEMO ? 'Demo-Modus' : 'Verbunden mit deiner Google-Tabelle') + '</p>' +
    '<p class="sub">App ' + APP_VERSION + ' · Apps Script ' + sv + '</p>' +
    '<div class="setlist">' +
      (sheetUrl ? btn('xSheet', '📊 Tabelle öffnen', 'Deine Google-Tabelle in Google Sheets') : '') +
      (DEMO ? '' : btn('xShort', '📲 Kurzbefehle einrichten', 'Anleitung für „Job speichern“ und „Job-Link speichern“ mit deinem Schlüssel')) +
      btn('xLog', '📝 Änderungen', 'Was in welcher Version neu ist (CHANGELOG)') +
      (DEMO ? '' : btn('xMail', '✉️ Mails jetzt prüfen', 'Sucht sofort nach Bestätigungen, Absagen und Einladungen. Läuft sonst automatisch alle 30 Minuten.')) +
      btn('xRe', '🔗 Anders verbinden', 'Neuen App-Link oder Schlüssel eintragen, z. B. nach einem neuen Schlüssel') +
      (DEMO ? '' : btn('xOut', '⏏️ Verbindung trennen', 'Löscht App-Link und Schlüssel auf diesem Gerät. Die Tabelle bleibt unverändert.')) +
    '</div><p class="sub" style="margin-top:12px">Created by Matthias Lobinger</p>',
    '<button class="ib" id="xClose">Schließen</button>');
  const ext = (u) => { if (IOS) openExt(u); else window.open(u, '_blank', 'noopener'); };
  if ($('xSheet')) $('xSheet').onclick = () => ext(sheetUrl);
  if ($('xShort')) $('xShort').onclick = () => ext(new URL('kurzbefehl.html', location.href).href.replace(/#.*$/, '') + '#setup=' + encSetup(CFG));

/* ---------- Laden und Anzeigen ---------- */
function vLess(a, b) {
  const x = String(a || '0').split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); }
  return false;
}
async function load(spin) {
  if (spin) $('bRefresh').classList.add('spin');
  try {
    const r = await api('apiList');
    jobs = r.jobs || []; statuses = r.statuses || STATUS_DEF; sheetUrl = r.sheetUrl || ''; profile = r.profile || []; scriptVersion = DEMO ? APP_VERSION : (r.version || '');
    if (!DEMO && vLess(scriptVersion, NEED_SCRIPT) && !load._warned) { load._warned = true; toast('Dein Apps Script ist veraltet (' + (scriptVersion || 'alt') + '). Bitte Code aus GitHub neu kopieren und neue Version bereitstellen – siehe CHANGELOG.', 9000); }
    if (!DEMO) ls.set(LK, { jobs: jobs, statuses: statuses, sheetUrl: sheetUrl, profile: profile, version: scriptVersion, at: Date.now() });
    render();
    loadSuggestions(!shownSug);
  } catch (e) {
    if (e.message !== 'Kein Zugriff') toast('Laden fehlgeschlagen: ' + e.message, 8000);
  } finally { $('bRefresh').classList.remove('spin'); }
}
$('bRefresh').onclick = () => load(true);

function renderChips() {
  const c = {}; jobs.forEach((j) => { c[j.status] = (c[j.status] || 0) + 1; });
  const allOn = statuses.every((s) => filter.on.includes(s));
  $('chips').innerHTML = '<button class="chip meta" data-all="1">' + (allOn ? 'Alle aus' : 'Alle an') + '</button>' +
    statuses.map((s) => '<button class="chip' + (filter.on.includes(s) ? ' on' : '') + '" data-s="' + esc(s) + '" style="--c:' + col(s) + '"><i></i>' + esc(SHORT[s] || s) + ' <b>' + (c[s] || 0) + '</b></button>').join('');
}
$('chips').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.all) filter.on = statuses.every((s) => filter.on.includes(s)) ? [] : statuses.slice();
  else { const s = b.dataset.s; filter.on = filter.on.includes(s) ? filter.on.filter((x) => x !== s) : filter.on.concat(s); }
  ls.set(FK, filter); render();
};
$('q').oninput = () => { filter.q = $('q').value; render(); };
$('sort').onchange = () => { filter.sort = $('sort').value; ls.set(FK, filter); render(); };

function dots(n, max) { n = Number(n) || 0; return n ? '●'.repeat(n) + '○'.repeat(max - n) : ''; }
function fmtDate(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '.' + m[2] + '.' + m[1].slice(2) : String(iso || ''); }

const rankS = (st) => (st === 'Nicht bewerben' ? -1 : statuses.indexOf(st)); // „Nicht bewerben“ ganz unten
function visible() {
  const q = filter.q.trim().toLowerCase();
  let v = jobs.filter((j) => filter.on.includes(j.status) && (!q || (j.company + ' ' + j.role + ' ' + j.location).toLowerCase().includes(q)));
  const by = {
    date: (a, b) => String(b.appliedOn || '').localeCompare(String(a.appliedOn || '')),
    fit: (a, b) => (b.fit || 0) - (a.fit || 0),
    like: (a, b) => (b.like || 0) - (a.like || 0),
    status: (a, b) => rankS(b.status) - rankS(a.status),
    company: (a, b) => String(a.company).localeCompare(String(b.company), 'de')
  }[filter.sort] || (() => 0);
  return v.slice().sort((a, b) => by(a, b) || String(a.company).localeCompare(String(b.company), 'de'));
}

function render() {
  renderChips();
  const v = visible();
  $('cnt').textContent = v.length + ' von ' + jobs.length;
  $('list').innerHTML = v.length ? v.map((j) =>
    '<div class="card" data-id="' + esc(j.id) + '" style="--c:' + col(j.status) + '">' +
      '<div class="r1"><span class="co">' + esc(j.company || '–') + '</span><span class="dt">' + esc(fmtDate(j.appliedOn)) + '</span></div>' +
      '<div class="ro">' + esc(j.role) + '</div>' +
      '<div class="r3"><span class="pill" style="--c:' + col(j.status) + '">' + esc(SHORT[j.status] || j.status) + '</span>' +
        (j.location ? '<span>' + esc(j.location) + '</span>' : '') +
        (j.interview ? '<span>📅 ' + esc(j.interview) + '</span>' : '') +
        (j.like ? '<span class="dots" title="Gefällt mir">♥ ' + dots(j.like, 5) + '</span>' : '') +
        (j.fit ? '<span class="dots fit" title="CV passt">CV ' + dots(j.fit, 5) + '</span>' : '') +
        (j.postingSaved ? '<span title="Anzeige gespeichert">📄</span>' : '') +
        (j.status === statuses[0] && j.url ? '<button class="capply" data-apply="' + esc(j.id) + '">Bewerben ↗</button>' : '') +
      '</div></div>').join('')
    : '<div class="empty">' + (jobs.length ? 'Keine Jobs für diesen Filter.' : 'Noch keine Jobs. Tipp auf +.') + '</div>';
  $('list').insertAdjacentHTML('beforeend', CREDIT);
}
$('list').onclick = (e) => {
  const a = e.target.closest('[data-apply]');
  if (a) { const j = jobs.find((x) => x.id === a.dataset.apply); if (j) applyNow(j); return; }
  const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id);
};

/* Stellenanzeigen auf iPhone/iPad immer in Safari öffnen (nicht in der LinkedIn-App o. Ä.).
   x-safari-https:// öffnet ab iOS 17 direkt Safari; dort greift „Job speichern“. */
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function openExt(url) {
  if (IOS && /^https?:\/\//i.test(url)) { location.href = 'x-safari-' + url; return; }
  window.open(url, '_blank', 'noopener');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-ext]');
  if (a && IOS) { e.preventDefault(); openExt(a.getAttribute('href')); }
});

/* Zugeschnittener CV über Claude: Auftrag in die Tabelle schreiben; die geplante Claude-Aufgabe baut ihn */
function cvBoxHtml(j) {
  if (j.cvLink) return '<p><b>Zugeschnittener CV ist fertig</b></p><p class="sub">Unten bei „Unterlagen“ öffnen.</p><button class="ib" id="cvAgain">Neu erstellen lassen</button>';
  if (/^angefordert/i.test(j.cvRequest || '')) return '<p><b>CV ' + esc(j.cvRequest) + '</b></p><p class="sub">Claude erstellt ihn bei der nächsten geplanten Runde (meist innerhalb von 2 Stunden). Dann erscheint hier „CV öffnen“.</p>';
  if (/^fehler/i.test(j.cvRequest || '')) return '<p class="miss">' + esc(j.cvRequest) + '</p><button class="ib" id="cvReq">Nochmal versuchen</button>';
  return '<p><b>Zugeschnittener CV</b></p><p class="sub">Claude baut einen CV passend zu dieser Stelle (nur wahre Inhalte, Sprache der Anzeige).</p><button class="ib pri" id="cvReq">CV mit Claude erstellen</button>';
}
function wireCv(j) {
  const go = async (e) => {
    if (e) e.preventDefault();
    if (!j.postingSaved && !confirm('Für diesen Job ist noch keine Anzeige gespeichert. Claude nutzt dann nur Titel und Link. Trotzdem anfordern?')) return;
    try { const r = await api('apiRequestCv', j.id); Object.assign(j, r); $('cvBox').innerHTML = cvBoxHtml(j); wireCv(j); toast('CV angefordert'); }
    catch (err) { toast(err.message, 5000); }
  };
  if ($('cvReq')) $('cvReq').onclick = go;
  if ($('cvAgain')) $('cvAgain').onclick = go;
}

/* Bewerben: Anzeige öffnen und – falls noch nicht gespeichert – im Hintergrund über den Link sichern */
function applyNow(j) {
  if (!j.url) { toast('Kein Link hinterlegt.'); return; }
  openExt(j.url);
  if (j.postingSaved) return;
  api('apiSavePosting', { id: j.id, url: j.url })
    .then((r) => { Object.assign(j, r.job); render(); toast('Anzeige automatisch gespeichert'); })
    .catch(() => toast('Anzeige konnte nicht automatisch geholt werden – in Safari: Teilen → „Job speichern“.', 6000));
}

/* ---------- Bottom-Sheet ---------- */
/* Hintergrund sperren, solange ein Fenster offen ist (sonst scrollt auf dem iPhone die Liste dahinter mit). */
let lockY = null;
function lockBody() {
  if (lockY !== null) return;
  lockY = window.scrollY;
  Object.assign(document.body.style, { position: 'fixed', top: -lockY + 'px', left: '0', right: '0', width: '100%', overflow: 'hidden' });
}
function unlockBody() {
  if (lockY === null) return;
  Object.assign(document.body.style, { position: '', top: '', left: '', right: '', width: '', overflow: '' });
  window.scrollTo(0, lockY); lockY = null;
}
function openSheet(html, foot) {
  $('sheet').innerHTML = '<div class="sbody" id="sbody">' + html + '</div>' + (foot ? '<div class="sfoot">' + foot + '</div>' : '');
  $('ov').classList.add('show');
  lockBody();
  $('sbody').scrollTop = 0;
}
function closeSheet() { $('ov').classList.remove('show'); unlockBody(); }
// Wischen außerhalb des scrollbaren Bereichs (Abdunkelung, Knopfleiste) nicht an die Seite weitergeben
$('ov').addEventListener('touchmove', (e) => { if (!e.target.closest('.sbody')) e.preventDefault(); }, { passive: false });
$('ov').onclick = (e) => { if (e.target === $('ov')) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function head(title, sub, btns) {
  return '<div class="shead"><div class="tt"><h2>' + esc(title) + '</h2>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '</div>' + btns + '</div>';
}
function starRow(id, val, cls) {
  return '<div class="stars ' + (cls || '') + '" id="' + id + '" data-v="' + (val || '') + '">' +
    [1, 2, 3, 4, 5].map((n) => '<button type="button" data-n="' + n + '" class="' + (val >= n ? 'on' : '') + '">' + n + '</button>').join('') + '</div>';
}
function wireStars(id) {
  const el = $(id);
  el.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const n = Number(b.dataset.n), cur = Number(el.dataset.v) || 0, v = cur === n ? 0 : n;
    el.dataset.v = v || '';
    el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', Number(x.dataset.n) <= v));
  };
}
const statusOpts = (cur) => statuses.map((s) => '<option' + (s === cur ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
function inp(id, label, val, type) { return '<label class="fl"><span>' + label + '</span><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val) + '"></label>'; }

function openDetail(id) {
  const j = jobs.find((x) => x.id === id); if (!j) return;
  openSheet(
    head(j.company || '–', j.role + (j.location ? ' · ' + j.location : ''), '') +
    (j.status === statuses[0] && j.url ? '<button class="ib applybtn" id="bApply">Jetzt bewerben ↗</button>' : '') +
    '<div class="sec">Status</div>' +
    '<label class="fl"><span>Status</span><select id="fStatus">' + statusOpts(j.status) + '</select></label>' +
    '<div class="row2 stack">' + inp('fApplied', 'Beworben am', j.appliedOn, 'date') + inp('fInterview', 'Gespräch am (Datum, Uhrzeit)', j.interview) + '</div>' +
    '<div class="sec">Bewertung</div>' +
    '<div class="fl"><span>Gefällt mir</span>' + starRow('fLike', j.like) + '</div>' +
    '<div class="fl"><span>CV passt (Einschätzung)</span>' + starRow('fFit', j.fit, 'fit') + '</div>' +

    (j.status === statuses[0] ? '<div class="cvbox" id="cvBox">' + cvBoxHtml(j) + '</div>' : '') +
    '<div class="sec">Details</div>' +
    '<div class="row2 stack">' + inp('fSalary', 'Gehalt angegeben', j.salary) + inp('fChannel', 'Weg / Portal', j.channel) + '</div>' +
    '<label class="fl"><span>Notizen</span><textarea id="fNotes">' + esc(j.notes) + '</textarea></label>' +
    '<details><summary style="cursor:pointer;color:var(--mute);font-size:13px">Firma, Stelle, Ort, Link, CV ändern</summary>' +
      inp('fCompany', 'Firma', j.company) + inp('fRole', 'Stelle', j.role) + inp('fLocation', 'Ort / Remote', j.location) +
      inp('fUrl', 'Link Anzeige', j.url, 'url') + inp('fCv', 'CV-Datei', j.cv) + '</details>' +
    '<div class="box"><h3>Unterlagen</h3>' +
      ((j.url || j.cvLink || j.cv) ? '<div class="cvrow">' +
        (j.url ? '<button class="ib" id="aUrl">🌐 Anzeige online öffnen</button>' : '') +
        (j.cvLink || j.cv ? '<button class="ib pri" id="aCv">📄 CV öffnen</button>' : '') + '</div>' +
        (j.cv ? '<p class="sub">' + esc(j.cv) + '</p>' : '') : '') +
      (j.url ? '' : '<p>Kein Link hinterlegt.</p>') +
      '<p>' + (j.postingSaved ? 'Anzeige gespeichert am ' + esc(j.postingSaved) + ' · <a href="#" id="aShow">lesen</a> · <a href="#" id="aDel" class="del">löschen</a>' : '<span class="miss">Anzeige noch nicht gespeichert.</span>') + '</p>' +
      '<div class="acts" style="margin-top:6px">' + (j.url ? '<button class="ib" id="bFetch">Anzeige vom Link speichern</button>' : '') +
      '<button class="ib" id="bPaste">Text einfügen</button></div></div>',
    '<button class="ib" id="bClose">Schließen</button><button class="ib pri" id="bSave">Speichern</button>');
  if ($('bApply')) $('bApply').onclick = () => applyNow(j);
  wireCv(j);
  wireStars('fLike'); wireStars('fFit');
  $('bClose').onclick = closeSheet;
  $('bSave').onclick = async () => {
    const ch = {
      status: $('fStatus').value, appliedOn: $('fApplied').value, interview: $('fInterview').value.trim(),
      like: Number($('fLike').dataset.v) || '', fit: Number($('fFit').dataset.v) || '',
      salary: $('fSalary').value.trim(), channel: $('fChannel').value.trim(), notes: $('fNotes').value,
      company: $('fCompany').value.trim(), role: $('fRole').value.trim(), location: $('fLocation').value.trim(),
      url: $('fUrl').value.trim(), cv: $('fCv').value.trim()
    };
    Object.keys(ch).forEach((k) => { if (String(ch[k] == null ? '' : ch[k]) === String(j[k] == null ? '' : j[k])) delete ch[k]; });
    if (!Object.keys(ch).length) { closeSheet(); return; }
    $('bSave').disabled = true;
    try { const upd = await api('apiUpdate', j.id, ch); Object.assign(j, upd); render(); closeSheet(); toast('Gespeichert'); }
    catch (e) { toast('Fehler: ' + e.message, 4000); $('bSave').disabled = false; }
  };
  if ($('bFetch')) $('bFetch').onclick = async () => {
    if (j.postingSaved && !confirm('Für diesen Job ist schon eine Anzeige gespeichert. Durch die Anzeige vom Link ersetzen?')) return;
    $('bFetch').disabled = true; $('bFetch').textContent = 'Lade Anzeige …';
    try { const r = await api('apiSavePosting', { id: j.id, url: j.url, replace: true }); Object.assign(j, r.job); render(); openDetail(j.id); toast('Anzeige gespeichert (' + r.chars + ' Zeichen)'); }
    catch (e) { toast(e.message, 6000); $('bFetch').disabled = false; $('bFetch').textContent = 'Anzeige vom Link speichern'; }
  };
  $('bPaste').onclick = () => openPaste(j);
  if ($('aDel')) $('aDel').onclick = async (e) => {
    e.preventDefault();
    if (!confirm('Gespeicherte Anzeige für ' + j.company + ' wirklich löschen? Die Claude-Bewertung wird dabei auch zurückgesetzt.')) return;
    try { const r = await api('apiDeletePosting', j.id); Object.assign(j, r); render(); openDetail(j.id); toast('Anzeige gelöscht'); }
    catch (err) { toast(err.message, 5000); }
  };
  if ($('aShow')) $('aShow').onclick = (e) => { e.preventDefault(); openPosting(j); };
  if ($('aUrl')) $('aUrl').onclick = () => openExt(j.url);
  if ($('aCv')) $('aCv').onclick = async (e) => {
    e.preventDefault();
    if (j.cvLink) { window.open(j.cvLink, '_blank', 'noopener'); return; }
    const w = window.open('', '_blank'); // sofort öffnen, sonst blockiert Safari das Fenster nach dem Warten
    try {
      const u = await api('apiCvLink', j.cv);
      if (u) { if (w) w.location.href = u; else location.href = u; }
      else { if (w) w.close(); toast('Datei nicht in Google Drive gefunden.'); }
    } catch (err) { if (w) w.close(); toast(err.message, 4000); }
  };
}

function openPaste(j) {

    '<label class="fl"><span>Text der Stellenanzeige</span><textarea id="pText" style="min-height:260px"></textarea></label>',

    const t = $('pText').value.trim(); if (t.length < 50) { toast('Bitte den ganzen Anzeigentext einfügen.'); return; }
    if (j.postingSaved && !confirm('Für diesen Job ist schon eine Anzeige gespeichert. Durch den eingefügten Text ersetzen?')) return;
    try { const r = await api('apiSavePosting', { id: j.id, url: j.url, text: t, replace: true }); Object.assign(j, r.job); render(); openDetail(j.id); toast('Anzeige gespeichert'); }
    catch (e) { toast(e.message, 5000); }

function extractSkills(text, profile) {
  const t = String(text || '');
  const prof = (profile || []).map((p) => ({ skill: p.skill, low: p.skill.toLowerCase(), type: p.type }));
  const has = (name, re) => prof.some((p) => p.low === name.toLowerCase() || re.test(p.skill));
  const out = { hard: [], soft: [] };
  const seen = {};
  SKILLS.forEach(([name, type, re]) => { if (re.test(t)) { seen[name.toLowerCase()] = 1; out[type].push({ name: name, have: has(name, re) }); } });
  // eigene Profil-Skills, die nicht in der Liste stehen, direkt im Text suchen
  prof.forEach((p) => {
    if (seen[p.low] || SKILLS.some(([n, , re]) => n.toLowerCase() === p.low || re.test(p.skill))) return;
    const re = new RegExp('(^|[^\\wäöüß])' + p.skill.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^\\wäöüß]|$)', 'i');
    if (re.test(t)) out[p.type].push({ name: p.skill, have: true });
  });
  const h = out.hard.filter((x) => !/^(Deutsch|Englisch|Hochschulabschluss|Führerschein)$/.test(x.name));
  out.fit = h.length ? Math.round(100 * h.filter((x) => x.have).length / h.length) : null;
  out.fitOf = [h.filter((x) => x.have).length, h.length];
  return out;
}
function skillsHtml(sk) {
  const chips = (arr) => arr.map((x) => '<span class="sk' + (x.have ? ' have' : '') + '">' + (x.have ? '✓ ' : '') + esc(x.name) + '</span>').join('');
  if (!sk.hard.length && !sk.soft.length) return '';
  return '<section class="psec skills" id="psecSkills"><h3>Skills aus der Anzeige</h3>' +
    (sk.fit !== null ? '<p class="fitline"><b>Passung Hard Skills: ' + sk.fit + ' %</b> <span class="sub">(' + sk.fitOf[0] + ' von ' + sk.fitOf[1] + ' bringst du laut Profil mit)</span></p>' : '') +
    (sk.hard.length ? '<h4>Hard Skills</h4><div class="sks">' + chips(sk.hard) + '</div>' : '') +
    (sk.soft.length ? '<h4>Soft Skills</h4><div class="sks">' + chips(sk.soft) + '</div>' : '') +
    '<p class="sub" style="font-size:12.5px;margin-top:8px">✓ = steht in deinem Profil (Tabelle, Blatt „Profil“). Grau = fehlt dort – ggf. ergänzen, wenn du es kannst.</p></section>';
}

/* ---------- Stellenanzeige gegliedert anzeigen ----------
   Nur Darstellung: Der gespeicherte Text bleibt unverändert. Jede Zeile landet in genau einem Abschnitt,
   die Reihenfolge bleibt wie im Original – es geht nichts verloren. */
const PSEC = [
  { key: 'tasks', name: 'Aufgaben', c: 'var(--s1)', re: /^(ihre|deine|eure|unsere)?\s*(aufgaben|tätigkeiten|tätigkeitsbereich|aufgabengebiet|verantwortung(en|sbereich)?)|^(was (sie|du) (bei uns )?(erwartet|machen|bewegen)|das erwartet (sie|dich)|dein job|ihr job|your (tasks|responsibilities|role|impact|mission)|responsibilities|key responsibilities|what you('ll| will) do|(about )?the role|in this role|key responsibilities|tasks)\b/i },
  { key: 'profile', name: 'Profil', c: 'var(--s2)', re: /^(ihr|dein|euer)\s*profil|^(profil|anforderungen|qualifikation(en)?|voraussetzungen|das bringst du mit|das bringen sie mit|was (sie|du) mitbring(en|st)|was wir (von dir |von ihnen )?erwarten|wen wir suchen|your profile|requirements|qualifications?( and experience)?|experience and qualifications|what you bring|who you are|about you|what we('re| are) looking for|skills|must[- ]have|nice[- ]to[- ]have)\b/i },
  { key: 'offer', name: 'Wir bieten', c: 'var(--s4)', re: /^(was )?wir bieten|^(ihre|deine) (vorteile|benefits)|^(benefits|vorteile|unser angebot|das bieten wir|darauf (kannst du|können sie) dich|warum (wir|zu uns)|why (join|us)|what we offer|we offer|perks|our offer)\b/i },
  { key: 'company', name: 'Über die Firma', c: 'var(--s3)', re: /^(über uns|wer wir sind|das unternehmen|unternehmen|about us|about the company|who we are|our company|company|über (die|das) )/i },
  { key: 'contact', name: 'Bewerbung & Kontakt', c: 'var(--navy)', re: /^(interesse geweckt|kontakt|ansprechpartner|bewerbung|so bewirbst du dich|jetzt bewerben|haben wir dein interesse|klingt (gut|spannend)|contact|how to apply|apply now|interested)/i }
];
function headingOf(line) {
  const t = line.replace(/^[#*\s]+|[*\s]+$/g, '').replace(/[:：]$/, '').trim();
  if (!t || t.length > 70 || /^[-•·]/.test(line.trim())) return null;
  for (const s of PSEC) if (s.re.test(t)) return { sec: s, title: t };
  return null;
}
function htmlText(t) {
  // Ältere Einträge enthalten teils HTML (z. B. von LinkedIn) – nur für die Anzeige in Text umwandeln
  for (let i = 0; i < 2 && /<\/?(p|br|li|ul|strong|div|span|b|em)\b[^>]*>/i.test(t); i++) {
    const d = document.createElement('div');
    d.innerHTML = t.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h[1-6]|ul|ol)>/gi, '$&\n').replace(/<li[^>]*>/gi, '$&- ').replace(/<(strong|b)>([^<]{2,70})<\/\1>/gi, '\n$2\n');
    t = (d.textContent || '').replace(/[ \t\u00a0]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  return t;
}
function formatPosting(text) {
  text = htmlText(String(text || ''));
  const lines = text.replace(/\r/g, '').split('\n');
  const secs = [];
  let cur = { sec: null, title: 'Einleitung', lines: [] };
  const push = () => { if (cur.lines.some((l) => l.trim())) secs.push(cur); };
  lines.forEach((raw) => {
    const line = raw.replace(/\s+$/, '');
    // „Ihre Aufgaben: Tests planen …“ in einer Zeile → Überschrift abtrennen
    if (/^\s*(•••|\*\*\*|---|___)\s*$/.test(line)) { push(); cur = { sec: null, title: 'Weitere Informationen', lines: [] }; return; }
    const inl = line.match(/^(.{3,40}?):\s+(.+)$/);
    const hi = inl && headingOf(inl[1]);
    if (hi) { push(); cur = { sec: hi.sec, title: hi.title, lines: [inl[2]] }; return; }
    const h = headingOf(line);
    if (h) { push(); cur = { sec: h.sec, title: h.title, lines: [] }; return; }
    cur.lines.push(line);
  });
  push();
  const blocks = (ls) => {
    let out = '', list = [], para = [];
    const flushP = () => { if (para.length) { out += '<p>' + esc(para.join(' ')) + '</p>'; para = []; } };
    const flushL = () => { if (list.length) { out += '<ul>' + list.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'; list = []; } };
    ls.forEach((l) => {
      const t = l.trim();
      if (!t) { flushP(); flushL(); return; }
      const b = t.match(/^([-–•·*▪◦●]|\d{1,2}[.)])\s+(.*)$/);
      if (b) { flushP(); list.push(b[2]); return; }
      flushL();
      if (t.length <= 60 && !/[.!,;]$/.test(t) && /^[A-ZÄÖÜ0-9]/.test(t) && para.length === 0) { out += '<h4>' + esc(t) + '</h4>'; return; }
      para.push(t);
    });
    flushP(); flushL();
    return out;
  };
  let n = 0;
  const html = secs.map((s) => {
    const id = 'psec' + (n++);
    s.id = id;
    const name = s.sec ? s.sec.name : s.title;
    const sub = s.sec && s.title.toLowerCase() !== s.sec.name.toLowerCase() ? '<span style="font-weight:400;color:var(--mute);font-size:13px"> · ' + esc(s.title) + '</span>' : '';
    return '<section class="psec" id="' + id + '" style="--pc:' + (s.sec ? s.sec.c : 'var(--mute)') + '"><h3>' + esc(name) + sub + '</h3>' + blocks(s.lines) + '</section>';
  }).join('');
  const nav = secs.length > 1 ? '<div class="pnav"><button data-to="psecSkills">Skills</button>' + secs.map((s) => '<button data-to="' + s.id + '">' + esc(s.sec ? s.sec.name : s.title) + '</button>').join('') + '</div>' : '';
  return { html: html, nav: nav };
}

/* ---------- Rückmeldungen aus Gmail ---------- */
let suggestions = [], shownSug = false;
async function loadSuggestions(autoOpen) {
  try { suggestions = await api('apiSuggestions') || []; }
  catch (e) { suggestions = []; }  // Gmail-Abgleich nicht eingerichtet oder alte Skriptversion: still ignorieren
  const bar = $('mailbar');
  bar.classList.toggle('show', suggestions.length > 0);
  bar.textContent = '✉️ ' + suggestions.length + (suggestions.length === 1 ? ' neue Rückmeldung per Mail' : ' neue Rückmeldungen per Mail') + ' – ansehen';
  if (autoOpen && suggestions.length && !$('ov').classList.contains('show')) { shownSug = true; openSuggestion(0); }
}
$('mailbar').onclick = () => openSuggestion(0);

function openSuggestion(i) {
  const s = suggestions[i]; if (!s) { closeSheet(); return; }
  const verb = { 'Abgelehnt': 'als „Abgelehnt“ markieren', 'Zum Gespräch eingeladen': 'auf „Zum Gespräch eingeladen“ setzen',
    'Persönliches Gespräch': 'auf „Persönliches Gespräch“ setzen', 'Beworben': 'als „Beworben“ markieren' }[s.status] || 'auf „' + s.status + '“ setzen';
  openSheet('<h2>Rückmeldung per Mail</h2><p class="sub">' + (i + 1) + ' von ' + suggestions.length + '</p>' +
    '<div class="sug" style="--c:' + col(s.status) + '"><b>' + esc(s.company) + '</b> · ' + esc(s.role) +
      '<div class="meta">' + esc(s.art) + ' · ' + esc(fmtDate(s.date)) + ' · ' + esc(s.from) + '</div>' +
      '<div><b>' + esc(s.subject) + '</b></div>' + (s.excerpt ? '<blockquote>' + esc(s.excerpt) + '</blockquote>' : '') + '</div>' +
    '<p>Soll ich die Bewerbung <b>' + verb + '</b>?</p>' +
    (s.link ? '<p><a href="' + esc(s.link) + '" target="_blank" rel="noopener">Mail in Gmail öffnen</a></p>' : ''),
    '<button class="ib" id="gLater">Später</button><button class="ib" id="gNo">Nein</button><button class="ib pri" id="gYes">Ja</button>');
  const done = async (accept) => {
    $('gYes').disabled = $('gNo').disabled = true;
    try {
      const r = await api('apiResolveSuggestion', s.vid, accept);
      if (r && r.job) { const j = jobs.find((x) => x.id === r.job.id); if (j) Object.assign(j, r.job); }
      suggestions.splice(i, 1); render(); loadBar(); toast(accept ? 'Status geändert' : 'Ignoriert');
      if (suggestions.length) openSuggestion(Math.min(i, suggestions.length - 1)); else closeSheet();
    } catch (e) { toast(e.message, 5000); $('gYes').disabled = $('gNo').disabled = false; }
  };
  $('gYes').onclick = () => done(true);
  $('gNo').onclick = () => done(false);
  $('gLater').onclick = closeSheet;
}
function loadBar() {
  const bar = $('mailbar'); bar.classList.toggle('show', suggestions.length > 0);
  bar.textContent = '✉️ ' + suggestions.length + (suggestions.length === 1 ? ' neue Rückmeldung per Mail' : ' neue Rückmeldungen per Mail') + ' – ansehen';
}

    if (fn === 'apiSavePosting') { const j = jobs.find((x) => x.id === (args[0] || {}).id) || {}; return res({ chars: 1234, job: Object.assign({}, j, { postingSaved: new Date().toLocaleDateString('de-DE') }) }); }
    rej(new Error('In der Demo nicht verfügbar'));
  }, 150));
}

/* ---------- Start ---------- */
(function start() {
  const f = ls.get(FK); if (f && Array.isArray(f.on)) { filter.on = f.on; filter.sort = f.sort || 'date'; }
  $('sort').value = filter.sort;
  const fromHash = parseSetup(location.hash);
  // Den #setup-Teil absichtlich in der Adresse lassen: „Zum Home-Bildschirm“ übernimmt so die Verbindung
  // (die Home-Bildschirm-App hat auf dem iPhone einen eigenen Speicher, getrennt von Safari).
  if (fromHash) { const old = ls.get(CK); if (!old || old.u !== fromHash.u || old.k !== fromHash.k) ls.del(LK); ls.set(CK, fromHash); }
  if (/#demo/.test(location.hash)) { DEMO = true; showApp(); load(); return; }
  CFG = fromHash || ls.get(CK);
  if (!valid(CFG)) { CFG = null; showSetup(); return; }
  showApp();
  const c = ls.get(LK);
  if (c && c.jobs) { jobs = c.jobs; statuses = c.statuses || STATUS_DEF; sheetUrl = c.sheetUrl || ''; profile = c.profile || []; scriptVersion = c.version || ''; render(); }
  load(!c);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
